<title>Matthews Consignment CRM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: black equipment-side top bar, saved-view rail on the left of a dense working table, detail pages split timeline / record. */
:root {
  --bg: #f1f3f6; --surface: #ffffff; --surface-2: #e8ecf1; --line: #d3d9e1; --line-2: #e4e8ee;
  --ink: #12161c; --ink-2: #47515f; --ink-3: #6f7a89;
  --bar: #0a0b0d; --bar-2: #1b1e23; --bar-ink: #f4f5f7; --bar-ink-2: #a6adb8; --bar-line: #343941;
  --brand-red: #e00503; --blue: #0167b5; --blue-ink: #ffffff; --link: #0160a8; --blue-soft: #dcecf8; --blue-soft-ink: #0b4f86;
  --good-soft: #dff2e6; --good-ink: #17653a; --warn-soft: #fbecc9; --warn-ink: #7a4b00; --crit: #c40c0a; --crit-soft: #fde2e1; --crit-ink: #9c0907;
  --neutral-soft: #e8ecf1; --neutral-ink: #47515f;
  --shadow: 0 1px 2px rgba(15, 23, 32, .06), 0 8px 24px rgba(15, 23, 32, .08);
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0d10; --surface: #16191e; --surface-2: #20242b; --line: #2e343d; --line-2: #242931;
    --ink: #eef1f5; --ink-2: #b3bbc7; --ink-3: #8a94a3;
    --bar: #000000; --bar-2: #16191e; --bar-ink: #f4f5f7; --bar-ink-2: #a6adb8; --bar-line: #343941;
    --brand-red: #e00503; --blue: #0a72c4; --blue-ink: #ffffff; --link: #6bb6f0; --blue-soft: #12324b; --blue-soft-ink: #a9d5f7;
    --good-soft: #143523; --good-ink: #8fdbac; --warn-soft: #3d2e0c; --warn-ink: #f2cb76; --crit: #ff5f58; --crit-soft: #461a19; --crit-ink: #ffb1ad;
    --neutral-soft: #242931; --neutral-ink: #b3bbc7;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0d10; --surface: #16191e; --surface-2: #20242b; --line: #2e343d; --line-2: #242931;
  --ink: #eef1f5; --ink-2: #b3bbc7; --ink-3: #8a94a3;
  --bar: #000000; --bar-2: #16191e; --bar-ink: #f4f5f7; --bar-ink-2: #a6adb8; --bar-line: #343941;
  --brand-red: #e00503; --blue: #0a72c4; --blue-ink: #ffffff; --link: #6bb6f0; --blue-soft: #12324b; --blue-soft-ink: #a9d5f7;
  --good-soft: #143523; --good-ink: #8fdbac; --warn-soft: #3d2e0c; --warn-ink: #f2cb76; --crit: #ff5f58; --crit-soft: #461a19; --crit-ink: #ffb1ad;
  --neutral-soft: #242931; --neutral-ink: #b3bbc7;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
h1, h2, h3, p, ul, ol, dl, dd, fieldset { margin: 0; padding: 0; }
ul, ol { list-style: none; }
fieldset { border: 0; min-width: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.wrap { max-width: 1440px; margin-inline: auto; padding-inline: clamp(16px, 2.4vw, 32px); }
main.wrap { padding-block: 20px 64px; display: flex; flex-direction: column; gap: 16px; }
.muted { color: var(--ink-3); }
.grow { flex: 1 1 auto; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.sel { user-select: all; overflow-wrap: anywhere; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.tight { gap: 6px; }
.row.end { justify-content: flex-end; }
body.ro .w { display: none !important; }

/* ---- top bar ---- */
.bar { background: var(--bar); color: var(--bar-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; border-bottom: 3px solid var(--brand-red); }
.bar-in { max-width: 1440px; margin-inline: auto; padding: 10px clamp(16px, 2.4vw, 32px) 8px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.brand { display: flex; flex-direction: column; line-height: 1; margin-right: auto; }
.brand-name { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
.brand-sub { font-family: var(--display); font-weight: 500; font-size: 13px; letter-spacing: .16em; text-transform: uppercase; color: var(--bar-ink-2); margin-top: 3px; }
.search { position: relative; flex: 1 1 220px; max-width: 420px; min-width: 0; }
.bar .search input[type=search] { width: 100%; background: var(--bar-2); border: 1px solid var(--bar-line); color: var(--bar-ink); border-radius: var(--r); padding: 8px 12px; }
.bar .search input[type=search]::placeholder { color: var(--bar-ink-2); }
.gresults { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 6px; max-height: 60vh; overflow: auto; display: flex; flex-direction: column; }
.gresults button { display: flex; justify-content: space-between; gap: 12px; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 4px; }
.gresults button:hover, .gresults button:focus-visible { background: var(--surface-2); }
.gr-h { font-family: var(--display); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; color: var(--ink-3); padding: 6px 10px 2px; }
.me { background: none; border: 1px solid var(--bar-line); color: var(--bar-ink); border-radius: 999px; padding: 6px 12px; font-size: 14px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tabs { max-width: 1440px; margin-inline: auto; padding-inline: clamp(8px, 2.4vw, 24px); display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { background: none; border: 0; color: var(--bar-ink-2); font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; padding: 8px 12px 9px; white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -3px; display: flex; gap: 6px; align-items: center; }
.tabs button:hover { color: var(--bar-ink); }
.tabs button.on { color: var(--bar-ink); border-bottom-color: var(--bar-ink); }
.badge { background: var(--brand-red); color: var(--bar-ink); border-radius: 999px; font-family: var(--body); font-size: 12px; font-weight: 600; letter-spacing: 0; padding: 0 7px; line-height: 18px; }

/* ---- buttons, inputs ---- */
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 13px; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: var(--crit-ink); border-color: var(--crit-soft); background: var(--crit-soft); white-space: normal; text-align: left; }
.btn.sm { padding: 3px 9px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.more { align-self: center; }
.link { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; text-underline-offset: 2px; text-align: left; }
.pill { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; font-size: 13px; }
.pill.on { background: var(--blue); border-color: var(--blue); color: var(--blue-ink); }
.copy { background: none; border: 0; color: var(--link); font-size: 12px; padding: 0 0 0 8px; text-decoration: underline; }
input[type=text], input[type=search], input[type=tel], input[type=email], input[type=url], input[type=number], input[type=date], input[type=datetime-local], select, textarea {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 10px; max-width: 100%; min-width: 0; }
textarea { width: 100%; resize: vertical; }
select.active { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
input.over { border-color: var(--crit); }

/* ---- page furniture ---- */
.page-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end; }
.page-head.second { margin-top: 20px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1.05; letter-spacing: .01em; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font-family: var(--display); font-weight: 600; font-size: 24px; letter-spacing: .02em; text-transform: uppercase; }
h3 { font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
h2.sec { font-size: 14px; letter-spacing: .14em; color: var(--ink-3); margin-top: 6px; }
.sub { color: var(--ink-2); max-width: 70ch; }
.count { color: var(--ink-3); font-size: 14px; font-variant-numeric: tabular-nums; }
.cnt { font-variant-numeric: tabular-nums; color: var(--ink-3); font-family: var(--body); font-weight: 500; letter-spacing: 0; font-size: 13px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select { padding: 6px 8px; font-size: 14px; max-width: 190px; }
.filters .q { flex: 1 1 240px; max-width: 360px; }
.banner { background: var(--warn-soft); color: var(--warn-ink); border-radius: var(--r); padding: 10px 14px; margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.banner.who { background: var(--blue-soft); color: var(--blue-soft-ink); }
.banner.who input, .banner.who select { color: var(--ink); }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 36px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
.empty p { max-width: 60ch; color: var(--ink-2); }
.start { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--blue); border-radius: var(--r); padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
.start p { max-width: 70ch; color: var(--ink-2); }
.spin { width: 26px; height: 26px; border: 3px solid var(--line); border-top-color: var(--blue); border-radius: 50%; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* ---- tiles ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; }
.tile, .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px 11px; text-align: left; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile:hover { border-color: var(--ink-3); }
.tile-n { font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; }
.tile-l { color: var(--ink-2); font-size: 14px; }
.tile-s { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
.tile.over { border-color: var(--crit); box-shadow: inset 4px 0 0 var(--crit); }
.tile.over .tile-n { color: var(--crit); }
.tile.now { box-shadow: inset 4px 0 0 var(--blue); }
.stat.warn { background: var(--warn-soft); border-color: transparent; }
.stat.warn .tile-n, .stat.warn .tile-l { color: var(--warn-ink); }
.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel.flush { padding: 4px 18px; }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

/* ---- bars (single series, one hue) ---- */
.bars { display: grid; grid-template-columns: minmax(0, 220px) minmax(60px, 1fr) auto auto; gap: 8px 12px; align-items: center; }
.bar-row { display: contents; }
.bar-l { display: flex; gap: 8px; align-items: center; min-width: 0; font-size: 14px; }
.bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.bar-t { height: 12px; background: var(--line-2); border-radius: 0 4px 4px 0; }
.bar-f { display: block; height: 100%; background: var(--blue); border-radius: 0 4px 4px 0; min-width: 3px; }
.bar-row:hover .bar-f { filter: brightness(1.2); }
.bar-n { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.bar-s { font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: 13px; text-align: right; }

/* ---- chips ---- */
.pri { display: inline-block; min-width: 34px; text-align: center; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .04em; border-radius: 4px; padding: 0 6px; line-height: 22px; border: 1.5px solid transparent; }
.pri-ap { background: var(--blue); color: var(--blue-ink); }
.pri-a { background: var(--blue-soft); color: var(--blue-soft-ink); border-color: var(--blue); }
.pri-bp { background: var(--blue-soft); color: var(--blue-soft-ink); }
.pri-b { background: var(--neutral-soft); color: var(--ink); }
.pri-c { background: none; color: var(--ink-3); border-color: var(--line); }
.pri-u { background: none; color: var(--ink-3); border-color: var(--line); border-style: dashed; font-size: 12px; }
.st { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 13px; font-weight: 500; white-space: nowrap; background: var(--neutral-soft); color: var(--neutral-ink); }
.st-out { background: var(--blue-soft); color: var(--blue-soft-ink); }
.st-hot, .st-won { background: var(--good-soft); color: var(--good-ink); }
.st-won { font-weight: 600; }
.st-warn { background: var(--warn-soft); color: var(--warn-ink); }
.st-dead { background: none; color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--line); }
.st-stop { background: var(--crit-soft); color: var(--crit-ink); }
.terr { display: inline-block; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .08em; border: 1.5px solid var(--ink-2); color: var(--ink); border-radius: 3px; padding: 0 6px; line-height: 19px; white-space: nowrap; }
.terr-un { border-style: dashed; border-color: var(--warn-ink); color: var(--warn-ink); }
.flag { display: inline-block; font-size: 12px; font-weight: 600; background: var(--crit-soft); color: var(--crit-ink); border-radius: 3px; padding: 0 6px; margin-left: 6px; border: 0; }
.flag.warn { background: var(--warn-soft); color: var(--warn-ink); }
.flag.big { font-size: 13px; padding: 2px 9px; margin-left: 0; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.asset { display: inline-block; background: var(--neutral-soft); color: var(--neutral-ink); border-radius: 3px; padding: 0 7px; font-size: 13px; margin: 0 4px 4px 0; }
.due { font-variant-numeric: tabular-nums; white-space: nowrap; }
.due.over { color: var(--crit); font-weight: 600; }
.due.now { color: var(--link); font-weight: 600; }

/* ---- tables ---- */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.tbl th button { background: none; border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: inherit; color: inherit; }
.tbl th[aria-sort] { color: var(--ink); }
.tbl th.num { text-align: right; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl tbody tr[data-act] { cursor: pointer; }
.tbl tbody tr[data-act]:hover { background: var(--surface-2); }
.tbl td.co { min-width: 180px; }
.tbl td.assets { min-width: 130px; color: var(--ink-2); }
.tbl td.wrap { min-width: 200px; max-width: 420px; overflow-wrap: anywhere; }
.tbl td .muted { font-size: 13px; }
.tbl tr.skip td { opacity: .6; }
.tbl tr.tr-un td { background: var(--surface-2); }
.name { background: none; border: 0; padding: 0; font-weight: 600; color: var(--ink); text-align: left; overflow-wrap: anywhere; }
.name:hover { color: var(--link); text-decoration: underline; }

/* ---- companies: saved-view rail ---- */
.split { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 20px; align-items: start; }
.split-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.views { display: flex; flex-direction: column; gap: 1px; }
.view { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; background: none; border: 0; border-left: 3px solid transparent; padding: 7px 10px; text-align: left; border-radius: 0 4px 4px 0; color: var(--ink-2); }
.view:hover { background: var(--surface-2); }
.view.on { border-left-color: var(--brand-red); background: var(--surface); color: var(--ink); font-weight: 600; }
@media (max-width: 900px) {
  .split { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .views { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
  .view { border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; white-space: nowrap; background: var(--surface); }
  .view.on { border-color: var(--brand-red); }
}

/* ---- lists ---- */
.rows { display: flex; flex-direction: column; }
.rows li { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line-2); }
.rows li:last-child { border-bottom: 0; }
.rows-main { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; }
.rows-main .muted { font-size: 13px; overflow-wrap: anywhere; }
.rows-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rows li.done .name { text-decoration: line-through; color: var(--ink-3); }
.tick input { width: 18px; height: 18px; accent-color: var(--blue); }
.cards { display: flex; flex-direction: column; gap: 10px; }
.cards li { border: 1px solid var(--line-2); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card-h { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dupe { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; }
.seg { display: flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--surface); }
.seg button { background: none; border: 0; border-right: 1px solid var(--line); padding: 6px 12px; font-size: 14px; }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--blue); color: var(--blue-ink); font-weight: 600; }
.seg button.on .cnt { color: var(--blue-ink); }

/* ---- company detail ---- */
.back { background: none; border: 0; padding: 0; color: var(--link); align-self: flex-start; }
.detail-head { display: flex; flex-wrap: wrap; gap: 16px 24px; justify-content: space-between; align-items: flex-start; }
.detail-title { min-width: 0; flex: 1 1 320px; }
.detail-set { display: flex; flex-wrap: wrap; gap: 10px; }
.mini-f { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: .08em; font-family: var(--display); font-weight: 600; }
.mini-f select, .mini-f input { font-family: var(--body); font-size: 15px; letter-spacing: 0; text-transform: none; font-weight: 500; color: var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.detail { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.detail-main, .detail-side { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 980px) { .detail { grid-template-columns: minmax(0, 1fr); } }
.kvs { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line-2); }
.kv:last-child { border-bottom: 0; }
.kv dt { color: var(--ink-3); font-size: 13px; }
.kv dd { min-width: 0; overflow-wrap: anywhere; }
.notes { background: var(--surface-2); border-radius: var(--r); padding: 10px 12px; }
.tl { display: flex; flex-direction: column; border-left: 2px solid var(--line); margin-left: 5px; }
.tl li { position: relative; padding: 0 0 16px 18px; display: flex; flex-direction: column; gap: 3px; }
.tl li:last-child { padding-bottom: 2px; }
.tl li::before { content: ""; position: absolute; left: -7px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--blue); }
.tl-h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.tl-h .muted { font-size: 13px; }
.tl-h .link { font-size: 13px; margin-left: auto; }

/* ============================================================
   Derived data — rebuilt once per data change, read by every screen.
   Last contact, contact method and outreach attempts are computed from
   the activity log (plus any imported starting values), so they can't drift.
   ============================================================ */
const D = { ver: -1 };
function derive() {
  if (D.ver === S.ver) return D;
  const actByCo = new Map(), actByCt = new Map(), stats = new Map();
  for (const a of S.ac.values()) {
    if (a.co) { if (!actByCo.has(a.co)) actByCo.set(a.co, []); actByCo.get(a.co).push(a); }
    if (a.ct) { if (!actByCt.has(a.ct)) actByCt.set(a.ct, []); actByCt.get(a.ct).push(a); }
    const m = ACT_META[a.type] || {};
    if (a.co && (m.contact || m.attempt)) {
      let st = stats.get(a.co);
      if (!st) { st = { last: '', lastAt: '', method: '', attempts: 0 }; stats.set(a.co, st); }
      if (m.attempt) st.attempts++;
      const stamp = a.at + '|' + (a.created || '');
      if (m.contact && stamp > st.lastAt) { st.lastAt = stamp; st.last = isoToYmd(a.at); st.method = m.method || ''; }
    }
  }
  const byAt = (x, y) => (x.at < y.at ? 1 : x.at > y.at ? -1 : 0);
  for (const l of actByCo.values()) l.sort(byAt);
  for (const l of actByCt.values()) l.sort(byAt);
  const group = (map, key) => { const out = new Map(); for (const r of map.values()) { const v = r[key]; if (!v) continue; if (!out.has(v)) out.set(v, []); out.get(v).push(r); } return out; };
  D.actByCo = actByCo; D.actByCt = actByCt; D.stats = stats;
  D.ctByCo = group(S.ct, 'co'); D.tkByCo = group(S.tk, 'co'); D.opByCo = group(S.op, 'co');
  D.dups = findDuplicates();
  D.dupIds = new Set(); for (const g of D.dups) for (const id of g.ids) D.dupIds.add(id);
  D.ver = S.ver;
  return D;
}
function coInfo(c) {
  const st = derive().stats.get(c.id);
  const base = c.lastContactBase || '';
  let last = base, method = c.lastMethodBase || '';
  if (st && st.last && st.last >= base) { last = st.last; method = st.method; }
  return { last, method, attempts: (Number(c.attemptsBase) || 0) + (st ? st.attempts : 0) };
}
const isDormant = (c, info) => !!info.last && daysBetween(info.last, today()) > DORMANT_DAYS && !DEAD_STATUSES.includes(c.status);
function primaryContact(coId) {
  const l = derive().ctByCo.get(coId) || [];

}
const ctName = c => c ? (clean((c.first || '') + ' ' + (c.last || '')) || c.email || '(No name)') : '';
const coName = id => { const c = S.co.get(id); return c ? c.name : ''; };

/* Likely duplicates: same normalized name in the same state, same website, or same phone. */
function findDuplicates() {
  const parent = new Map();
  const find = x => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent.set(a, b); };
  const keys = new Map(), why = new Map();
  const note = (key, id, label) => {
    if (keys.has(key)) { const other = keys.get(key); union(id, other); why.set(id, label); if (!why.has(other)) why.set(other, label); }
    else keys.set(key, id);
  };
  for (const c of S.co.values()) parent.set(c.id, c.id);
  for (const c of S.co.values()) {
    const n = normName(c.name);
    if (n.length >= 3) note('n:' + n + '|' + normState(c.state), c.id, 'Same name');
    const d = matchDomain(c.web); if (d) note('d:' + d, c.id, 'Same website');
    const p = normPhone(c.phone); if (p) note('p:' + p, c.id, 'Same phone');
  }
  const groups = new Map();
  for (const id of parent.keys()) { const r = find(id); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(id); }
  const out = [];
  for (const ids of groups.values()) {
    if (ids.length < 2) continue;
    ids.sort();
    const sig = ids.join('+');
    if (ids.every(id => S.co.get(id).dupOk === sig)) continue;
    out.push({ ids, sig, why: [...new Set(ids.map(id => why.get(id)).filter(Boolean))].join(', ') });
  }
  return out;
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const first = text.split(/\r?\n/, 1)[0] || '';
  const delim = (first.split('\t').length > first.split(',').length) ? '\t' : ((first.split(';').length > first.split(',').length) ? ';' : ',');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cur); cur = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cur); cur = ''; rows.push(row); row = [];
    } else cur += ch;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => clean(c) !== ''));
}
function toCSV(header, rows) {
  const cell = v => { v = v == null ? '' : String(v); if (/^(=|@|\t|\r|[+\-](?![\d\s(.]))/.test(v)) v = "'" + v; return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  return '﻿' + [header, ...rows].map(r => r.map(cell).join(',')).join('\r\n') + '\r\n';
}

/* ============================================================
   Storage for the Claude-hosted build. Records live in "block" documents
   ({items: {id: record}}) so a prospect list of several thousand companies is a
   few dozen documents, a bulk import is a handful of writes, and edits merge
   field by field.
   ============================================================ */
const PLATFORM = 'claude';
const MAX_N = 80, MAX_B = 100000;
const Store = {
  db: null,
  where: { co: new Map(), ct: new Map(), ac: new Map(), tk: new Map(), op: new Map(), dr: new Map() },
  blocks: { co: {}, ct: {}, ac: {}, tk: {}, op: {}, dr: {} },
  cfgExists: {},
  _q: new Map(),
  _sizes: new WeakMap(),
  onChange: () => {},
  onError: () => {},

  init(db) {
    this.db = db;
    for (const k of KINDS) {
      db.collection(k).limit(1000).onSnapshot(snap => this._onKind(k, snap), e => this._subError(e));
    }
    db.collection('cfg').limit(50).onSnapshot(snap => this._onCfg(snap), e => this._subError(e));
    /* If a live subscription is slow to deliver its first snapshot, read that collection once. */
    setTimeout(() => {
      for (const k of KINDS) if (!S.loaded[k]) db.collection(k).limit(1000).get().then(snap => { if (!S.loaded[k]) this._onKind(k, snap); }, () => {});
      if (!S.loaded.cfg) db.collection('cfg').limit(50).get().then(snap => { if (!S.loaded.cfg) this._onCfg(snap); }, () => {});
    }, 7000);
  },
  _subError(e) { S.dbState = (e && e.code === 'revoked') ? 'revoked' : 'error'; this.onChange(); },
  _onKind(k, snap) {
    const map = new Map(), where = new Map(), blocks = {};
    for (const doc of snap.docs) {
      const data = doc.data() || {};
      const items = data.items || {};
      let info = this._sizes.get(data);
      if (!info) {
        let n = 0;
        for (const id in items) { const r = items[id]; if (r && !r._del) n++; }
        info = { n, bytes: JSON.stringify(items).length };
        this._sizes.set(data, info);
      }
      blocks[doc.id] = { n: info.n, bytes: info.bytes };
      for (const id in items) {
        const r = items[id];
        if (!r || r._del) continue;
        map.set(id, r); where.set(id, doc.id);
      }
    }
    S[k] = map; this.where[k] = where; this.blocks[k] = blocks;
    S.loaded[k] = true; this._bump();
  },
  _onCfg(snap) {
    const exists = {};
    let terr = {}, team = {}, outreach = {};
    for (const doc of snap.docs) {
      exists[doc.id] = true;
      const items = (doc.data() || {}).items || {};
      if (doc.id === 'territories') terr = items;
      if (doc.id === 'team') team = items;
      if (doc.id === 'outreach') outreach = items;
    }
    const liveOnly = o => { const out = {}; for (const id in o) if (o[id] && !o[id]._del) out[id] = o[id]; return out; };
    S.terr = liveOnly(terr); S.team = liveOnly(team); S.outreach = liveOnly(outreach);
    this.cfgExists = exists; S.loaded.cfg = true; S.cfgVer++; this._bump();
  },
  _bump() {
    S.ver++;
    if (!S.ready && KINDS.every(k => S.loaded[k]) && S.loaded.cfg) { S.ready = true; S.dbState = 'ok'; }
    this.onChange();
  },
  _enqueue(path, fn) {
    const prev = this._q.get(path) || Promise.resolve();
    const p = prev.then(fn, fn);
    this._q.set(path, p.catch(() => {}));
    return p;
  },
  async _try(fn) {
    const waits = [700, 1800, 4500];
    for (let i = 0; ; i++) {
      try { return await fn(); } catch (e) {
        const code = e && e.code;
        if ((code === 'unavailable' || code === 'resource_exhausted') && i < waits.length) {
          await new Promise(r => setTimeout(r, waits[i] + Math.random() * 400));
          continue;
        }
        throw e;
      }
    }
  },
  _write(path, op, body) {
    return this._enqueue(path, () => this._try(() => this.db.doc(path)[op](body)));
  },
  _local(k, id, rec, block) {
    if (rec && rec._del) { S[k].delete(id); this.where[k].delete(id); }
    else { S[k].set(id, rec); if (block) this.where[k].set(id, block); }
  },
  _openBlock(k) {
    let best = null;
    for (const id in this.blocks[k]) {
      const b = this.blocks[k][id];
      if (b.n < MAX_N && b.bytes < MAX_B && (!best || b.n > this.blocks[k][best].n)) best = id;
    }
    return best;
  },

  /** Create records. Each record must carry its own `id`. */
  async addMany(k, recs, onProgress) {
    if (!recs.length) return;
    let i = 0;
    const total = recs.length;
    const take = (n0, b0) => {
      const items = {}; let n = n0, b = b0;
      while (i < recs.length) {
        const sz = JSON.stringify(recs[i]).length + 24;
        if (n > n0 && (n >= MAX_N || b + sz > MAX_B)) break;
        items[recs[i].id] = recs[i]; n++; b += sz; i++;
      }
      return { items, n, b };
    };
    const open = this._openBlock(k);
    if (open) {
      const blk = this.blocks[k][open];
      const t = take(blk.n, blk.bytes);
      for (const id in t.items) this._local(k, id, t.items[id], open);
      blk.n = t.n; blk.bytes = t.b;
      S.ver++; this.onChange(true);
      await this._write(k + '/' + open, 'update', { items: t.items });
      if (onProgress) onProgress(i, total);
    }
    while (i < recs.length) {
      const t = take(0, 0);
      const bid = 'b' + uid();
      for (const id in t.items) this._local(k, id, t.items[id], bid);
      this.blocks[k][bid] = { n: t.n, bytes: t.b };
      S.ver++; this.onChange(true);
      await this._write(k + '/' + bid, 'set', { items: t.items });
      if (onProgress) onProgress(i, total);
    }
  },
  add(k, rec) { return this.addMany(k, [rec]); },

  /** Merge fields into existing records: list of [id, fields]. */
  async patchMany(k, list, onProgress) {
    const byBlock = new Map();
    for (const [id, fields] of list) {
      const blk = this.where[k].get(id);
      if (!blk) continue;
      if (!byBlock.has(blk)) byBlock.set(blk, {});
      const cur = byBlock.get(blk);
      cur[id] = Object.assign(cur[id] || {}, fields);
      const old = S[k].get(id);
      if (old) this._local(k, id, fields._del ? { _del: true } : Object.assign({}, old, fields));
    }
    S.ver++; this.onChange(true);
    let done = 0;
    for (const [blk, items] of byBlock) {
      await this._write(k + '/' + blk, 'update', { items });
      done += Object.keys(items).length;
      if (onProgress) onProgress(done, list.length);
    }
  },
  patch(k, id, fields) { return this.patchMany(k, [[id, fields]]); },
  remove(k, id) { return this.patch(k, id, { _del: true }); },

  /** Settings documents: cfg/territories, cfg/team and cfg/outreach. */
  async cfgPatch(name, id, fields) {
    const target = name === 'territories' ? S.terr : name === 'team' ? S.team : S.outreach;
    if (fields._del) delete target[id]; else target[id] = Object.assign({}, target[id] || {}, fields);
    S.cfgVer++; S.ver++; this.onChange(true);
    const path = 'cfg/' + name;
    const exists = this.cfgExists[name];
    this.cfgExists[name] = true;
    await this._write(path, exists ? 'update' : 'set', { items: { [id]: fields } });
  },
};

function coPass(c, f, skipRep) {

  if (hay.includes(q)) return true;

}
function filterCompanies(f) {

    out.push({ c, info });

      case 'priority': { const i = PRIORITIES.indexOf(c.priority); return i < 0 ? 99 : i; }
      case 'status': { const i = STATUSES.indexOf(c.status); return i < 0 ? 99 : i; }
      case 'rep': return repName(c.rep).toLowerCase() || '~';
      case 'last': return r.info.last || (dir > 0 ? '9999' : '');
      case 'nextFU': return c.nextFU || (dir > 0 ? '9999' : '');
      case 'attempts': return r.info.attempts;

/* ---------- toasts ---------- */
function toast(msg, opts) {
  opts = opts || {};
  const t = document.createElement('div');
  t.className = 'toast' + (opts.error ? ' err' : '');
  const span = document.createElement('span'); span.textContent = msg; t.appendChild(span);
  if (opts.action) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'link'; b.textContent = opts.action;
    b.addEventListener('click', () => { t.remove(); opts.onAction(); });
    t.appendChild(b);
  }
  const box = $('#toasts');
  box.appendChild(t);
  while (box.children.length > 3) box.firstElementChild.remove();
  setTimeout(() => t.remove(), opts.error ? 9000 : (opts.action ? 9000 : 4200));
}
function errText(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') return "The CRM's storage is full, so this wasn't saved. Export a backup from Import / Export and tell the CRM owner.";
  if (code === 'invalid_argument') return "This wasn't saved. You may have view-only access, or the record is too large.";
  if (code === 'denied') return "This wasn't saved: your account isn't allowed to change it. Ask a CRM admin.";
  if (code === 'conflict') return "This wasn't saved because another record already uses the same value (for a team member, the same email).";
  if (code === 'missing_link') return "This wasn't saved because a record it points to was removed. Reload the page and try again.";
  if (code === 'revoked' || code === 'not_granted') return "This wasn't saved because the page lost access to the database. Reload and try again.";
  return "This wasn't saved. Check your connection, reload the page and try again.";
}
async function guard(fn) {
  try { await fn(); } catch (e) { console.error(e); toast(errText(e), { error: true }); }
}

  else ctl = `<input id="${id}" type="${f.type || 'text'}" value="${esc(v)}"${f.list ? ` list="${f.list}"` : ''}${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}${f.dis ? ' disabled' : ''}${f.type === 'number' ? ` min="0" step="${f.step || 1}" inputmode="decimal"` : ''} maxlength="${f.max || 200}" autocomplete="off">`;

function readFields(spec) {

  for (const f of spec) {

    if (f.type === 'multi') o[f.k] = $$('input:checked', el).map(x => x.value);

async function changeStatus(c, status, extra) {
  const old = c.status;
  const patch = Object.assign({}, extra || {});
  const changed = !!status && status !== old;
  if (changed) { patch.status = status; patch.statusAt = nowIso(); }
  if (!Object.keys(patch).length) return;
  patch.updated = nowIso();
  const p = Store.patch('co', c.id, patch);
  if (changed && status === 'Interested') {
    const due = addBizDays(today(), 2);
    Store.add('tk', { id: uid(), name: 'Follow up with ' + c.name + ' (interested)', co: c.id, ct: (primaryContact(c.id) || {}).id || '', rep: c.rep || ME || '', due, type: 'Follow-Up', priority: 'High', status: 'Open', notes: 'Created automatically when the lead status changed to Interested.', created: nowIso(), auto: 'interested' }).catch(e => toast(errText(e), { error: true }));
    toast('Follow-up task created, due ' + fmtDate(due) + '.');
  }
  if (changed && status === 'Has Equipment') {
    toast(c.name + ' has equipment. Create an opportunity?', { action: 'Create opportunity', onAction: () => openOpp(null, c.id) });
  }
  await p;
}

function openMerge(sig) {
  const g = derive().dups.find(x => x.sig === sig);
  if (!g) return;
  const cos = g.ids.map(id => S.co.get(id)).filter(Boolean);
  const score = c => Object.keys(c).filter(k => c[k] && (!Array.isArray(c[k]) || c[k].length)).length + ((derive().actByCo.get(c.id) || []).length * 2);
  const best = cos.slice().sort((a, b) => score(b) - score(a))[0];
  const body = `<p class="dlg-sub">Pick the record to keep. Contacts, activity, tasks and opportunities from the others move onto it, blank fields are filled in, and notes are combined. The other records are removed.</p>
    <div class="merge">${cos.map(c => { const d = derive(); return `<label class="merge-row"><input type="radio" name="keep" id="keep-${esc(c.id)}" value="${esc(c.id)}"${c.id === best.id ? ' checked' : ''}><span><b>${esc(c.name)}</b><br><span class="muted">${esc([c.addr, c.city, c.state, c.zip].filter(Boolean).join(', ') || 'No address')}<br>${esc([fmtPhone(c.phone), domainOf(c.web)].filter(Boolean).join(' · ') || 'No phone or website')}<br>${(d.ctByCo.get(c.id) || []).length} contacts · ${(d.actByCo.get(c.id) || []).length} activities · ${esc(c.status || '')}</span></span></label>`; }).join('')}</div>`;
  openDialog({
    title: 'Merge duplicate companies', wide: true, body, submitLabel: 'Merge', noFocus: true,
    onSubmit: () => guard(async () => {
      const keepEl = $('input[name=keep]:checked');
      if (!keepEl) return dlgMsg('Pick the record to keep.');
      const keep = S.co.get(keepEl.value);
      const lose = cos.filter(c => c.id !== keep.id);
      closeDialog();
      await mergeCompanies(keep, lose);
      toast('Merged into ' + keep.name + '.');
    }),
  });
}
async function mergeCompanies(keep, lose) {
  const patch = {};
  const scalar = ['addr', 'city', 'county', 'state', 'zip', 'web', 'phone', 'industry', 'subIndustry', 'source', 'leadType', 'priority', 'rep', 'srcUrl', 'lastMethodBase'];
  let assets = new Set(keep.assets || []), notes = keep.notes || '', attempts = Number(keep.attemptsBase) || 0, last = keep.lastContactBase || '', fu = keep.nextFU || '';
  const cur = Object.assign({}, keep);
  for (const l of lose) {
    for (const k of scalar) if (!cur[k] && l[k]) { patch[k] = l[k]; cur[k] = l[k]; }
    for (const a of l.assets || []) assets.add(a);
    if (l.notes && !notes.includes(l.notes)) notes = notes ? notes + '\n\n' + l.notes : l.notes;
    attempts += Number(l.attemptsBase) || 0;
    if ((l.lastContactBase || '') > last) last = l.lastContactBase;
    if (l.nextFU && (!fu || l.nextFU < fu)) fu = l.nextFU;
    if (l.optOut) patch.optOut = true;
    if (l.dnc) patch.dnc = true;
  }
  patch.assets = [...assets]; patch.notes = cap(notes, 8000); patch.attemptsBase = attempts; patch.lastContactBase = last; patch.nextFU = fu; patch.updated = nowIso();
  if (keep.terrHow !== 'Manual') { const r = assignTerritory(Object.assign({}, cur)); patch.terr = r.code; patch.terrHow = r.how; }
  const loseIds = new Set(lose.map(l => l.id));
  const keepHasPrimary = (derive().ctByCo.get(keep.id) || []).some(x => x.primary);
  const move = kind => { const list = []; for (const r of S[kind].values()) if (loseIds.has(r.co)) { const p = { co: keep.id }; if (kind === 'ct' && r.primary && keepHasPrimary) p.primary = false; list.push([r.id, p]); } return list; };
  await Store.patch('co', keep.id, patch);
  for (const kind of ['ct', 'ac', 'tk', 'op']) { const l = move(kind); if (l.length) await Store.patchMany(kind, l); }
  await Store.patchMany('co', lose.map(l => [l.id, { _del: true }]));
}

  const stageRows = STAGES.filter(s => byStage.get(s)).map(s => ({ label: s, n: byStage.get(s) }));
  const fuHtml = `<section class="panel"><h3>Follow-ups due now</h3>${fuList.length ? `<ul class="rows">${fuList.slice(0, 8).map(c => { const p = primaryContact(c.id); const ph = (p && (p.mobile || p.phone)) || c.phone; return `<li><div class="rows-main"><button type="button" class="name" data-act="co-open" data-id="${esc(c.id)}">${esc(c.name)}</button><span class="muted">${esc([p ? ctName(p) : '', ph ? fmtPhone(ph) : ''].filter(Boolean).join(' · '))}</span></div><div class="rows-meta">${priChip(c.priority)}${dueSpan(c.nextFU)}<button type="button" class="btn sm w" data-act="log" data-id="${esc(c.id)}" data-type="Phone Call">Log call</button></div></li>`; }).join('')}</ul>${fuList.length > 8 ? `<button type="button" class="link" data-act="go-view" data-view="followup">See all ${fuList.length}</button>` : ''}` : `<p class="muted">${empty ? 'Companies with a follow-up date of today or earlier will be listed here.' : 'Nothing is due. Follow-ups appear here on their date.'}</p>`}</section>`;
  const tkHtml = `<section class="panel"><h3>Tasks due now</h3>${tkList.length ? `<ul class="rows">${tkList.slice(0, 8).map(taskRow).join('')}</ul>${tkList.length > 8 ? `<button type="button" class="link" data-act="go-tasks" data-tk="open">See all ${tkList.length}</button>` : ''}` : `<p class="muted">${empty ? 'Open tasks due today or earlier will be listed here.' : 'No tasks are due.'}</p>`}</section>`;
  return head + start + tiles + `<div class="two">${fuHtml}${tkHtml}</div><div class="two">${barList('Open opportunities by territory', terrRows, 'Open opportunities will be counted here by territory.')}${barList('Opportunities by stage', stageRows, 'Opportunities will be counted here by stage.')}</div>`;
};
function taskRow(k) {
  const done = k.status === 'Completed' || k.status === 'Cancelled';
  const ap = isAppt(k);
  const line = ap ? [apptWhen(k), k.location, k.ct && S.ct.get(k.ct) ? 'with ' + ctName(S.ct.get(k.ct)) : '', repName(k.rep)] : [k.type, k.co ? coName(k.co) : '', repName(k.rep)];
  const cal = ap && !done ? calendarHref(k) : '';
  return `<li class="${done ? 'done' : ''}"><label class="tick w" title="${done ? 'Reopen' : 'Mark complete'}"><input type="checkbox" id="tk-${esc(k.id)}" data-change="tk-done" data-id="${esc(k.id)}"${k.status === 'Completed' ? ' checked' : ''}><span class="vh">Complete ${esc(k.name)}</span></label>
    <div class="rows-main"><button type="button" class="name" data-act="tk-open" data-id="${esc(k.id)}">${esc(k.name)}</button><span class="muted">${esc(line.filter(Boolean).join(' · '))}${k.status === 'Snoozed' ? ' · Snoozed' : ''}${k.status === 'Cancelled' ? ' · Cancelled' : ''}</span></div>
    <div class="rows-meta">${ap ? '<span class="st st-out">Appointment</span>' : ''}${k.priority === 'High' ? '<span class="st st-stop">High</span>' : ''}${done ? `<span class="muted">${esc(k.doneAt ? 'Done ' + fmtDate(isoToYmd(k.doneAt)) : k.status)}</span>` : dueSpan(k.due)}${cal ? `<a class="btn sm" href="${esc(cal)}" target="_blank" rel="noopener noreferrer" title="Opens Google Calendar with this appointment filled in">Add to calendar</a>` : ''}${done || ap ? '' : `<button type="button" class="btn sm w" data-act="tk-snooze" data-id="${esc(k.id)}" data-days="1" title="Snooze 1 day">+1d</button><button type="button" class="btn sm w" data-act="tk-snooze" data-id="${esc(k.id)}" data-days="7" title="Snooze 1 week">+1w</button>`}</div></li>`;
}

/* ---------- Companies ---------- */
SCREENS.companies = function () {
  if (V.coId) { if (S.co.has(V.coId)) return companyDetail(S.co.get(V.coId)); V.coId = null; }
  const f = V.co, rows = filterCompanies(f), view = viewById(f.view);
  const counts = {};
  const infos = [];
  for (const c of S.co.values()) infos.push([c, coInfo(c)]);
  for (const v of VIEWS) { if (v.hidden && v.id !== f.view) continue; let n = 0; for (const [c, i] of infos) if (v.fn(c, i)) n++; counts[v.id] = n; }
  const rail = `<nav class="views" aria-label="Saved views">${VIEWS.filter(v => !v.hidden || v.id === f.view).map(v => `<button type="button" class="view${v.id === f.view ? ' on' : ''}" data-act="co-view" data-view="${v.id}" title="${esc(v.hint || '')}"><span>${esc(v.name)}</span><span class="cnt">${counts[v.id]}</span></button>`).join('')}</nav>`;
  const th = (key, label, cls) => `<th class="${cls || ''}"${f.sort === key ? ` aria-sort="${f.dir > 0 ? 'ascending' : 'descending'}"` : ''}><button type="button" data-act="co-sort" data-key="${key}">${esc(label)}${f.sort === key ? (f.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`;
  const d = derive();
  const body = rows.slice(0, f.limit).map(({ c, info }) => {
    const as = c.assets || [];
    const flags = (c.status === 'Do Not Contact' || c.dnc ? '<span class="flag">DNC</span>' : '') + (c.optOut ? '<span class="flag">No email</span>' : '') + (d.dupIds.has(c.id) ? '<span class="flag warn">Dup?</span>' : '');
    return `<tr data-act="co-open" data-id="${esc(c.id)}">
      <td class="co"><button type="button" class="name" data-act="co-open" data-id="${esc(c.id)}">${esc(c.name)}</button>${flags}<div class="muted">${esc([clean((c.city || '') + (c.state ? ', ' + c.state : '')), c.industry].filter(Boolean).join(' · '))}</div></td>
      <td>${terrTag(c.terr)}</td><td>${priChip(c.priority)}</td><td>${statusChip(c.status)}</td>
      <td class="assets">${as.length ? esc(as.slice(0, 2).join(', ')) + (as.length > 2 ? ` <span class="muted">+${as.length - 2}</span>` : '') : '<span class="muted">–</span>'}</td>
      <td>${esc(repName(c.rep)) || '<span class="muted">–</span>'}</td>
      <td>${info.last ? esc(fmtDate(info.last)) : '<span class="muted">Never</span>'}<div class="muted">${esc([info.last ? info.method : '', info.attempts ? info.attempts + (info.attempts === 1 ? ' attempt' : ' attempts') : ''].filter(Boolean).join(' · '))}</div></td>
      <td>${dueSpan(c.nextFU)}</td></tr>`;
  }).join('');
  const any = f.q || f.terr || f.rep || f.industry || f.asset || f.priority || f.status;
  const emptyMsg = S.co.size === 0
    ? `<div class="empty"><h2>No companies yet</h2><p>Import a prospect list or add a company. Each company gets a territory, a lead status of New, and an activity timeline.</p><div class="row"><button type="button" class="btn primary w" data-act="tab" data-tab="import">Import a spreadsheet</button><button type="button" class="btn w" data-act="co-new">Add a company</button></div></div>`
    : `<div class="empty"><p>No companies match ${esc(view.name)}${any ? ' with these filters' : ''}.</p>${any ? '<button type="button" class="link" data-act="co-clear">Clear filters</button>' : ''}</div>`;
  return `<div class="page-head"><div><h1>Companies</h1><p class="sub">${esc(view.hint || 'Every company in the CRM')}</p></div><div class="row">${exportBtn('co')}</div></div>
    <div class="split">${rail}<section class="split-main">
      <div class="filters"><input id="flt-co-q" type="search" class="q" placeholder="Search name, city, phone, contact" value="${esc(f.q)}" data-input="filter" data-scope="co" data-key="q" aria-label="Search companies">${coFilterBar('co')}${any ? '<button type="button" class="link" data-act="co-clear">Clear filters</button>' : ''}</div>
      <p class="count">${rows.length.toLocaleString()} ${rows.length === 1 ? 'company' : 'companies'}</p>
      ${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>${th('name', 'Company')}${th('terr', 'Territory')}${th('priority', 'Priority')}${th('status', 'Lead status')}<th>Asset potential</th>${th('rep', 'Rep')}${th('last', 'Last contact')}${th('nextFU', 'Next follow-up')}</tr></thead><tbody>${body}</tbody></table></div>${rows.length > f.limit ? `<button type="button" class="btn more" data-act="more" data-scope="co">Show 100 more</button>` : ''}` : emptyMsg}
    </section></div>`;
};

function companyDetail(c) {
  const d = derive(), info = coInfo(c);
  const contacts = (d.ctByCo.get(c.id) || []).slice().sort((a, b) => (b.primary ? 1 : 0) - (a.primary ? 1 : 0) || ctName(a).localeCompare(ctName(b)));
  const acts = d.actByCo.get(c.id) || [];
  const tasks = (d.tkByCo.get(c.id) || []).filter(isOpenTask).sort(apptSort);
  const opps = (d.opByCo.get(c.id) || []).slice().sort((a, b) => (b.created || '') < (a.created || '') ? -1 : 1);
  const t = S.terr[c.terr], appt = nextAppt(c.id);
  const url = safeUrl(c.web), src = safeUrl(c.srcUrl);
  const flags = [
    c.status === 'Do Not Contact' ? '<span class="flag big">Do Not Contact</span>' : '',
    c.dnc ? '<span class="flag big">Do Not Call</span>' : '', c.optOut ? '<span class="flag big">Email opt-out</span>' : '',
    c.terr === UNASSIGNED ? '<span class="flag big warn">Territory needs review</span>' : '',
    d.dupIds.has(c.id) ? '<button type="button" class="flag big warn" data-act="tab" data-tab="review">Possible duplicate</button>' : '',
    isDormant(c, info) ? '<span class="flag big warn">Dormant: review for nurture</span>' : '',
    appt ? `<button type="button" class="flag big appt" data-act="tk-open" data-id="${esc(appt.id)}">${esc((appt.apptKind || 'Appointment') + ' ' + apptWhen(appt))}</button>` : '',
  ].join('');
  const row = (label, val) => `<div class="kv"><dt>${esc(label)}</dt><dd>${val || '<span class="muted">–</span>'}</dd></div>`;
  const details = `<dl class="kvs">
    ${row('Main phone', c.phone ? `<span class="sel">${esc(fmtPhone(c.phone))}</span>${copyBtn(fmtPhone(c.phone))}` : '')}
    ${row('Website', url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(domainOf(c.web) || c.web)}</a>` : esc(c.web))}
    ${row('Address', esc([c.addr, clean((c.city || '') + (c.state ? ', ' + c.state : '') + ' ' + (c.zip || ''))].filter(Boolean).join(', ')))}
    ${row('County', esc(c.county))}
    ${row('Territory', terrTag(c.terr) + ' ' + esc(c.terr === UNASSIGNED ? 'No territory matched' + (c.terrHow === 'State missing' ? ' (state is missing)' : '') : terrName(c.terr) + (t && t.state ? ', ' + t.state : '')) + (c.terrHow && c.terr !== UNASSIGNED ? ` <span class="muted">· ${c.terrHow === 'Manual' ? 'set by hand' : 'matched by ' + esc(c.terrHow)}</span>` : ''))}
    ${row('Territory owner', t ? esc(repName(t.owner)) : '')}
    ${row('Assigned rep', esc(repName(c.rep)))}
    ${row('Industry', esc([c.industry, c.subIndustry].filter(Boolean).join(' · ')))}
    ${row('Asset potential', (c.assets || []).map(a => `<span class="asset">${esc(a)}</span>`).join(''))}
    ${row('Lead source', esc(c.source))}${row('Lead type', esc(c.leadType))}
    ${row('Last contact', info.last ? esc(fmtDate(info.last) + (info.method ? ' · ' + info.method : '')) : 'Never')}
    ${row('Outreach attempts', String(info.attempts))}
    ${row('Source URL', src ? `<a href="${esc(src)}" target="_blank" rel="noopener noreferrer">${esc(domainOf(c.srcUrl) || 'Open source')}</a>` : esc(c.srcUrl))}
    ${row('Added', esc(c.created ? fmtDate(isoToYmd(c.created)) : ''))}${row('Updated', esc(c.updated ? fmtDate(isoToYmd(c.updated)) : ''))}
  </dl>${c.notes ? `<h3>Notes</h3><div class="pre notes">${esc(c.notes)}</div>` : ''}`;
  const ctHtml = contacts.length ? `<ul class="cards">${contacts.map(x => `<li><div class="card-h"><button type="button" class="name" data-act="ct-open" data-id="${esc(x.id)}">${esc(ctName(x))}</button>${x.primary ? '<span class="st st-out">Primary</span>' : ''}${x.dnc ? '<span class="flag">DNC</span>' : ''}${x.optOut ? '<span class="flag">No email</span>' : ''}</div>
      <div class="muted">${esc([x.title, x.role && x.role !== x.title ? x.role : '', x.dept].filter(Boolean).join(' · '))}</div>
      ${x.email ? `<div><span class="sel">${esc(x.email)}</span>${copyBtn(x.email)}</div>` : ''}${x.phone ? `<div><span class="sel">${esc(fmtPhone(x.phone))}</span>${copyBtn(fmtPhone(x.phone))}</div>` : ''}${x.mobile ? `<div><span class="sel">${esc(fmtPhone(x.mobile))}</span> <span class="muted">mobile</span>${copyBtn(fmtPhone(x.mobile))}</div>` : ''}
      <div class="row tight"><button type="button" class="btn sm w" data-act="log" data-id="${esc(c.id)}" data-ct="${esc(x.id)}" data-type="Phone Call">Log call</button><button type="button" class="btn sm w" data-act="log" data-id="${esc(c.id)}" data-ct="${esc(x.id)}" data-type="Email Sent">Log email</button>${CAP.sample && x.email && !x.optOut ? `<button type="button" class="btn sm ai w" data-act="dr-new" data-id="${esc(c.id)}" data-ct="${esc(x.id)}">Draft email</button>` : ''}</div></li>`).join('')}</ul>` : `<p class="muted">No contacts yet. Add the person who makes equipment decisions.</p>`;
  const opHtml = opps.length ? `<ul class="cards">${opps.map(o => `<li><div class="card-h"><button type="button" class="name" data-act="op-open" data-id="${esc(o.id)}">${esc(o.name)}</button><span class="st ${isOpenStage(o.stage) ? 'st-hot' : 'st-early'}">${esc(o.stage)}</span></div><div class="muted">${esc([o.category, o.units ? o.units + ' units' : '', money(o.value), o.auctionDate ? 'Auction ' + fmtDate(o.auctionDate) : ''].filter(Boolean).join(' · '))}</div></li>`).join('')}</ul>` : `<p class="muted">No opportunities. Create one when there is actual equipment to sell.</p>`;
  const tlHtml = acts.length ? `<ol class="tl">${acts.map(a => `<li><div class="tl-h"><span class="tl-type">${esc(a.type)}</span><span class="muted">${esc([fmtDateTime(a.at), repName(a.by), a.ct && S.ct.get(a.ct) ? 'with ' + ctName(S.ct.get(a.ct)) : ''].filter(Boolean).join(' · '))}</span><button type="button" class="link w" data-act="ac-open" data-id="${esc(a.id)}">Edit</button></div>${a.outcome ? `<div class="tl-o">${esc(a.outcome)}</div>` : ''}${a.notes ? `<div class="pre">${esc(a.notes)}</div>` : ''}${a.nextFU ? `<div class="muted">Follow-up set for ${esc(fmtDate(a.nextFU))}</div>` : ''}</li>`).join('')}</ol>` : `<p class="muted">No activity yet. Log the first call or email and it appears here, newest first.</p>`;
  const logBtn = (type, label) => `<button type="button" class="btn w" data-act="log" data-id="${esc(c.id)}" data-type="${esc(type)}">${esc(label)}</button>`;
  return `<button type="button" class="back" data-act="co-back">← Companies</button>
    <div class="detail-head">
      <div class="detail-title"><h1>${esc(c.name)}</h1><p class="sub">${esc([clean((c.city || '') + (c.state ? ', ' + c.state : '')), c.industry].filter(Boolean).join(' · '))} ${terrTag(c.terr)}</p>${flags ? `<div class="flags">${flags}</div>` : ''}</div>
      <div class="detail-set">
        <label class="mini-f"><span>Priority</span><select id="d-pri" class="w" data-change="co-set" data-id="${esc(c.id)}" data-key="priority"><option value=""></option>${optList(PRIORITIES, c.priority)}</select></label>
        <label class="mini-f"><span>Lead status</span><select id="d-status" class="w" data-change="co-status" data-id="${esc(c.id)}">${optList(STATUSES, c.status)}</select></label>
        <label class="mini-f"><span>Next follow-up</span><input id="d-fu" class="w${c.nextFU && c.nextFU <= today() ? ' over' : ''}" type="date" value="${esc(c.nextFU || '')}" data-change="co-set" data-id="${esc(c.id)}" data-key="nextFU"></label>
      </div>
    </div>
    <div class="actions">${CAP.sample ? `<button type="button" class="btn ai w" data-act="dr-new" data-id="${esc(c.id)}">Draft email with AI</button>` : ''}${logBtn('Phone Call', 'Log call')}${logBtn('Email Sent', 'Log email')}${logBtn('Voicemail', 'Log voicemail')}${logBtn('Note', 'Add note')}<button type="button" class="btn w" data-act="log-other" data-id="${esc(c.id)}">Other activity</button><span class="grow"></span><button type="button" class="btn w" data-act="ap-new" data-id="${esc(c.id)}">+ Appointment</button><button type="button" class="btn w" data-act="tk-new" data-id="${esc(c.id)}">+ Task</button><button type="button" class="btn w" data-act="op-new" data-id="${esc(c.id)}">+ Opportunity</button><button type="button" class="btn w" data-act="co-edit" data-id="${esc(c.id)}">Edit</button></div>
    <div class="detail">
      <section class="detail-main">
        ${tasks.length ? `<div class="panel"><h3>Open tasks and appointments</h3><ul class="rows">${tasks.map(taskRow).join('')}</ul></div>` : ''}
        <div class="panel"><h3>Activity</h3>${tlHtml}</div>
      </section>
      <aside class="detail-side">
        <div class="panel"><div class="panel-h"><h3>Contacts</h3><button type="button" class="btn sm w" data-act="ct-new" data-id="${esc(c.id)}">+ Contact</button></div>${ctHtml}</div>
        <div class="panel"><div class="panel-h"><h3>Opportunities</h3><button type="button" class="btn sm w" data-act="op-new" data-id="${esc(c.id)}">+ Opportunity</button></div>${opHtml}</div>
        <div class="panel"><h3>Details</h3>${details}</div>
      </aside>
    </div>`;
}

/* ---------- Contacts ---------- */
SCREENS.contacts = function () {
  const f = V.ct, q = clean(f.q).toLowerCase();
  const rows = [];
  for (const x of S.ct.values()) {
    if (f.role && x.role !== f.role) continue;
    if (q) { const hay = [ctName(x), x.email, x.title, coName(x.co), x.phone, x.mobile].join(' ').toLowerCase(); if (!hay.includes(q)) continue; }
    rows.push(x);
  }
  rows.sort((a, b) => ctName(a).localeCompare(ctName(b)));
  const body = rows.slice(0, f.limit).map(x => `<tr data-act="ct-open" data-id="${esc(x.id)}">
    <td class="co"><button type="button" class="name" data-act="ct-open" data-id="${esc(x.id)}">${esc(ctName(x))}</button>${x.primary ? '<span class="st st-out">Primary</span>' : ''}${x.dnc ? '<span class="flag">DNC</span>' : ''}${x.optOut ? '<span class="flag">No email</span>' : ''}<div class="muted">${esc([x.title, x.role && x.role !== x.title ? x.role : ''].filter(Boolean).join(' · '))}</div></td>
    <td>${x.co && S.co.has(x.co) ? `<button type="button" class="link" data-act="co-open" data-id="${esc(x.co)}">${esc(coName(x.co))}</button>` : '<span class="muted">No company</span>'}</td>
    <td><span class="sel">${esc(x.email || '')}</span></td><td><span class="sel">${esc(fmtPhone(x.phone))}</span></td><td><span class="sel">${esc(fmtPhone(x.mobile))}</span></td><td>${dueSpan(x.nextFU)}</td></tr>`).join('');
  return `<div class="page-head"><div><h1>Contacts</h1><p class="sub">Every contact, across all companies</p></div><div class="row">${exportBtn('ct')}<button type="button" class="btn primary w" data-act="ct-new" data-id="">+ Contact</button></div></div>
    <div class="filters"><input id="flt-ct-q" type="search" class="q" placeholder="Search name, company, email, phone" value="${esc(f.q)}" data-input="filter" data-scope="ct" data-key="q" aria-label="Search contacts">${fsel('ct', 'role', 'Role', ROLES)}</div>
    <p class="count">${rows.length.toLocaleString()} ${rows.length === 1 ? 'contact' : 'contacts'}</p>
    ${rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Contact</th><th>Company</th><th>Email</th><th>Phone</th><th>Mobile</th><th>Next follow-up</th></tr></thead><tbody>${body}</tbody></table></div>${rows.length > f.limit ? `<button type="button" class="btn more" data-act="more" data-scope="ct">Show 100 more</button>` : ''}`
      : `<div class="empty"><p>${S.ct.size ? 'No contacts match.' : 'Contacts appear here as you add them to companies or import them with a prospect list.'}</p></div>`}`;
};

/* ---------- Opportunities ---------- */
SCREENS.opportunities = function () {
  const f = V.op, q = clean(f.q).toLowerCase();
  const rows = [];
  let val = 0, weighted = 0;
  for (const o of S.op.values()) {
    if (f.stage === 'open' ? !isOpenStage(o.stage) : (f.stage && f.stage !== 'all' && o.stage !== f.stage)) continue;
    if (f.terr && oppTerr(o) !== f.terr) continue;
    if (f.rep && oppRep(o) !== f.rep) continue;
    if (q && ![o.name, coName(o.co), o.desc, o.category].join(' ').toLowerCase().includes(q)) continue;
    rows.push(o); val += Number(o.value) || 0; weighted += (Number(o.value) || 0) * (Number(o.prob) || 0) / 100;
  }
  rows.sort((a, b) => STAGES.indexOf(a.stage) - STAGES.indexOf(b.stage) || (a.closeDate || '9') .localeCompare(b.closeDate || '9'));
  const stageOpts = [['open', 'Open stages'], ['all', 'All stages']].concat(STAGES.map(s => [s, s]));
  const body = rows.map(o => `<tr data-act="op-open" data-id="${esc(o.id)}">
    <td class="co"><button type="button" class="name" data-act="op-open" data-id="${esc(o.id)}">${esc(o.name)}</button><div class="muted">${esc(o.category || '')}</div></td>
    <td>${o.co && S.co.has(o.co) ? `<button type="button" class="link" data-act="co-open" data-id="${esc(o.co)}">${esc(coName(o.co))}</button>` : '<span class="muted">–</span>'}</td>
    <td>${terrTag(oppTerr(o))}</td><td><span class="st ${isOpenStage(o.stage) ? 'st-hot' : (o.stage === 'Sold' ? 'st-won' : 'st-early')}">${esc(o.stage)}</span></td>
    <td class="num">${o.units != null ? esc(o.units) : ''}</td><td class="num">${esc(money(o.value))}</td><td class="num">${o.prob != null ? esc(o.prob) + '%' : ''}</td>
    <td>${esc(fmtDate(o.auctionDate))}</td><td>${esc(fmtDate(o.closeDate))}</td><td>${esc(repName(oppRep(o)))}</td></tr>`).join('');
  return `<div class="page-head"><div><h1>Opportunities</h1><p class="sub">Actual equipment and real consignment possibilities</p></div><div class="row">${exportBtn('op')}<button type="button" class="btn primary w" data-act="op-new" data-id="">+ Opportunity</button></div></div>
    <div class="filters"><input id="flt-op-q" type="search" class="q" placeholder="Search opportunity, company, equipment" value="${esc(f.q)}" data-input="filter" data-scope="op" data-key="q" aria-label="Search opportunities">

/* ---------- Tasks ---------- */
SCREENS.tasks = function () {
  const f = V.tk, t = today(), we = weekEnd();
  const tabs = [['today', 'Due today'], ['overdue', 'Overdue'], ['week', 'This week'], ['appts', 'Appointments'], ['open', 'All open'], ['done', 'Completed']];
  const counts = { today: 0, overdue: 0, week: 0, appts: 0, open: 0, done: 0 };
  const rows = [];
  for (const k of S.tk.values()) {
    if (f.rep && (f.rep === 'none' ? !!k.rep : k.rep !== f.rep)) continue;
    const open = k.status === 'Open' || k.status === 'Snoozed';
    const which = [];
    if (open) { which.push('open'); if (isAppt(k)) which.push('appts'); if (k.due === t) which.push('today'); if (k.due && k.due < t) which.push('overdue'); if (k.due && k.due >= t && k.due <= we) which.push('week'); }
    else which.push('done');
    for (const w of which) counts[w]++;
    if (which.includes(f.tab)) rows.push(k);
  }
  if (f.tab === 'done') rows.sort((a, b) => (b.doneAt || b.created || '').localeCompare(a.doneAt || a.created || ''));
  else rows.sort((a, b) => apptSort(a, b) || TASK_PRI.indexOf(a.priority) - TASK_PRI.indexOf(b.priority));
  return `<div class="page-head"><div><h1>Tasks</h1><p class="sub">Appointments, calls, emails and follow-ups with a due date</p></div><div class="row">${exportBtn('tk')}<button type="button" class="btn w" data-act="ap-new" data-id="">+ Appointment</button><button type="button" class="btn primary w" data-act="tk-new" data-id="">+ Task</button></div></div>

      ${ME ? `<button type="button" class="pill${f.rep === ME ? ' on' : ''}" data-act="tk-me">Mine</button>` : ''}${fsel('tk', 'rep', 'Assigned to', repOpts(true))}</div>

};

async function saveFile(filename, data) {
  if (!CAP.downloads) return toast('Saving files isn\'t available in this view.', { error: true });
  try { await CAP.downloads.save({ filename, data }); toast('Saved ' + filename + '.'); }
  catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? 'Finish the open save prompt first, then try again.' : 'The file couldn\'t be saved from this view.', { error: true }); }
}
function doExport(kind) {
  if (kind === 'backup') {
    const dump = { exported: nowIso(), territories: S.terr, team: Object.fromEntries(Object.entries(S.team).map(([id, r]) => [id, { name: r.name, active: r.active !== false }])) };
    for (const k of KINDS) dump[KIND_LABEL[k]] = [...S[k].values()];
    return saveFile('matthews-crm-backup-' + today() + '.json', JSON.stringify(dump, null, 1));
  }
  if (kind === 'template') {
    return saveFile('matthews-import-template.csv', toCSV(['Company Name', 'Address', 'City', 'County', 'State', 'ZIP Code', 'Website', 'Main Phone', 'Industry', 'Sub-Industry', 'Lead Source', 'Lead Type', 'Prospect Priority', 'Asset Potential', 'Assigned Rep', 'Notes', 'Source URL', 'Contact First Name', 'Contact Last Name', 'Job Title', 'Contact Role', 'Contact Email', 'Contact Phone', 'Mobile Phone'], []));
  }

  if (!x) return;
  if (!x.rows.length) return toast('There is nothing to export yet.');
  saveFile(x.name + '-' + today() + '.csv', toCSV(x.head, x.rows));
}

/* ============================================================
   Appointments: a scheduled call, visit or meeting with a prospect.
   Stored as a task of type "Appointment" with a time, a place and a kind, so it
   shows up everywhere tasks do (dashboard, company page, Tasks tab).
   ============================================================ */
const APPT_KINDS = ['Phone call', 'Site visit', 'In-person meeting', 'Video call'];
const APPT_ACTIVITY = { 'Phone call': 'Phone Call', 'Site visit': 'Site Visit', 'In-person meeting': 'Meeting', 'Video call': 'Meeting' };
const isAppt = k => !!k && k.type === 'Appointment';
const isOpenTask = k => k.status === 'Open' || k.status === 'Snoozed';
const validTime = hm => /^([01]?\d|2[0-3]):[0-5]\d/.test(hm || '');
function fmtTime(hm) {
  if (!validTime(hm)) return '';
  const p = hm.split(':').map(Number);
  return new Date(2000, 0, 1, p[0], p[1]).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}
const apptWhen = k => [k.due ? fmtDate(k.due) : '', fmtTime(k.time)].filter(Boolean).join(', ');
const apptSort = (a, b) => (a.due || '9999').localeCompare(b.due || '9999') || (a.time || '99').localeCompare(b.time || '99');
function nextAppt(coId) {
  const t = today();
  return (derive().tkByCo.get(coId) || []).filter(k => isAppt(k) && isOpenTask(k) && k.due && k.due >= t).sort(apptSort)[0] || null;
}
function companyAddress(c) {
  return c ? [c.addr, clean((c.city || '') + (c.state ? ', ' + c.state : '') + ' ' + (c.zip || ''))].filter(Boolean).join(', ') : '';
}
/* A link that opens Google Calendar with the appointment filled in. Times are the rep's local time. */
function calendarHref(k) {
  if (!k.due) return '';
  const enc = encodeURIComponent, day = s => s.replace(/-/g, '');
  let dates;
  if (validTime(k.time)) {
    const p = k.time.split(':').map(Number), start = parseYmd(k.due);
    start.setHours(p[0], p[1], 0, 0);
    const end = new Date(start.getTime() + (k.apptKind === 'Phone call' ? 30 : 60) * 60000);
    const f = d => day(ymd(d)) + 'T' + pad2(d.getHours()) + pad2(d.getMinutes()) + '00';
    dates = f(start) + '/' + f(end);
  } else dates = day(k.due) + '/' + day(addDays(k.due, 1));
  const c = k.co && S.co.get(k.co), ct = k.ct && S.ct.get(k.ct);
  const details = [ct ? 'With ' + ctName(ct) + ((ct.mobile || ct.phone) ? ', ' + fmtPhone(ct.mobile || ct.phone) : '') : '', c && c.phone ? 'Company phone: ' + fmtPhone(c.phone) : '', k.notes || ''].filter(Boolean).join('\n');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + enc(k.name || 'Appointment') + '&dates=' + dates + '&details=' + enc(cap(details, 1500)) + '&location=' + enc(k.location || '');
}
function apptName(kind, coId, ctId) {
  const c = coId && S.co.get(coId), ct = ctId && S.ct.get(ctId);
  return (kind || 'Appointment') + (c ? ' with ' + c.name : ct ? ' with ' + ctName(ct) : '');
}
function apptKindChanged() {
  const kind = $('#f-apptKind'), loc = $('#f-location');
  if (!kind || !loc) return;
  const addr = loc.dataset.addr || '';
  const inPerson = kind.value === 'Site visit' || kind.value === 'In-person meeting';
  if (inPerson && !clean(loc.value)) loc.value = addr;
  else if (!inPerson && clean(loc.value) === addr) loc.value = '';
}
function openAppt(id, coId, ctId) {
  const t = id ? S.tk.get(id) : null;
  if (t) coId = t.co;
  const c = coId ? S.co.get(coId) : null;
  const contacts = coId ? (derive().ctByCo.get(coId) || []) : [];
  const prim = coId ? primaryContact(coId) : null;
  const spec = [
    coPickerField(coId),
    { k: 'apptKind', label: 'Kind of appointment', type: 'select', opts: APPT_KINDS, noBlank: true },
    { k: 'ct', label: 'With', type: 'select', opts: contacts.map(x => [x.id, ctName(x) + (x.title ? ' · ' + x.title : '')]), blank: 'No specific contact' },

    extra: t ? `<button type="button" class="btn danger" data-act="del" data-kind="tk" data-id="${esc(t.id)}">Delete</button>` : '',
    onSubmit: () => guard(async () => {
      const v = readFields(spec);
      const pick = readCoPicker(coId);
      if (pick.error) return dlgMsg(pick.error);
      if (!v.due) return dlgMsg('Pick the date of the appointment.');
      if (!validTime(v.time)) return dlgMsg('Pick the time of the appointment.');
      if (!t && v.due < today()) return dlgMsg('Pick today or a later date. To record a meeting that already happened, use Other activity on the company page.');
      const rec = { name: apptName(v.apptKind, pick.id, v.ct), co: pick.id, ct: v.ct || '', rep: v.rep || '', due: v.due, time: v.time.slice(0, 5), location: cap(clean($('#f-location').value), 200), apptKind: v.apptKind, type: 'Appointment', notes: v.notes };
      if (t) { rec.status = v.status; if (v.status === 'Completed' && !t.doneAt) rec.doneAt = nowIso(); if (v.status !== 'Completed') rec.doneAt = ''; }
      closeDialog();
      toast('Appointment ' + (t ? 'saved' : 'set') + ' for ' + apptWhen(rec) + '.');
      if (t) await Store.patch('tk', t.id, rec);
      else await Store.add('tk', Object.assign({ id: uid(), priority: 'Normal', status: 'Open', created: nowIso() }, rec));
    }),
  });
}

  ['ct.full', 'Contact Full Name', ['contact', 'contact name', 'full name', 'primary contact', 'contact full name', 'owner name', 'owner', 'principal']],
  ['ct.first', 'Contact First Name', ['first name', 'first', 'contact first name', 'fname']],
  ['ct.last', 'Contact Last Name', ['last name', 'last', 'contact last name', 'lname', 'surname']],
